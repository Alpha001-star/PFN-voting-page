<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Portal Closed</title>
    <style>
        /* Reset and Base Styles matching Prestige Face Nigeria */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #000000; /* Deep primary black */
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient background glow utilizing the brand theme colors */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(197, 160, 89, 0.08); /* Soft gold aura */
            filter: blur(120px);
            top: 15%;
            left: 10%;
            border-radius: 50%;
            z-index: 1;
        }

        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(26, 26, 26, 0.6);
            filter: blur(100px);
            bottom: 15%;
            right: 10%;
            border-radius: 50%;
            z-index: 1;
        }

        /* Container Card matching elite-card styles */
        .closed-portal-card {
            background: linear-gradient(135deg, #111111 0%, #050505 100%);
            border: 1px solid #c5a059; /* Elite Gold Border */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(197, 160, 89, 0.1);
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Icon Container with brand gold treatment */
        .icon-container {
            width: 80px;
            height: 80px;
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 28px;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.15);
        }

        .icon-container svg {
            width: 32px;
            height: 32px;
            fill: #c5a059; /* Brand Elite Gold */
        }

        /* Typography */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        p {
            font-size: 0.95rem;
            color: #888888; /* Elite paragraph gray */
            line-height: 1.7;
            margin-bottom: 20px;
        }

        /* Highlight elements styling */
        .highlight-gold {
            color: #c5a059;
            font-weight: 600;
        }

        /* Decorative Gold Divider Line */
        .divider-line {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, #c5a059, transparent);
            margin: 20px auto 28px;
            width: 70%;
        }

        /* Entrance Animation */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive scaling adjustments */
        @media (max-width: 768px) {
            .closed-portal-card {
                padding: 40px 25px;
                margin: 10px;
            }
            h1 {
                font-size: 1.75rem;
            }
            p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="closed-portal-card">
        <!-- Secure Closed Lock SVG Asset -->
        <div class="icon-container">
            <svg viewBox="0 0 24 24">
                <path d="M18,8H17V6A5,5,0,0,0,7,6V8H6a3,3,0,0,0-3,3V19a3,3,0,0,0,3,3H18a3,3,0,0,0,3-3V11A3,3,0,0,0,18,8ZM9,6a3,3,0,0,1,6,0V8H9ZM19,19a1,1,0,0,1-1,1H6a1,1,0,0,1-1-1V11a1,1,0,0,1,1-1H18a1,1,0,0,1,1,1Z"/>
            </svg>
        </div>

        <h1>Portal Closed</h1>
        <div class="divider-line"></div>
        
        <p>We sincerely apologize, but the voting portal is now officially closed.</p>
        
        <p>No further transactions or votes can be accepted at this stage. Thank you all for your participation, support, and cooperation throughout the competition. <span class="highlight-gold">✨</span></p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            console.log("Portal status verified: Transaction handling disabled.");
        });
    </script>
</body>
</html>
