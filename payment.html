<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Closed | Prestige Face Nigeria</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           COLOR PALETTE & DESIGN SYSTEM (Matches Prestige Luxury Branding)
           ========================================================================== */
        :root {
            --primary: #111111;
            --accent: #c5a880; /* High-Fashion Gold */
            --light-bg: #f9f9f9;
            --text-dark: #222222;
            --text-light: #777777;
            --border-color: #e0e0e0;
            --white: #ffffff;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: 80px; /* Space for fixed navbar */
        }

        /* Professional Header Navigation */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            z-index: 999;
        }

        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--primary);
            text-decoration: none;
        }

        .exit-btn {
            text-decoration: none;
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
        }

        .exit-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        /* Main Container Framework */
        .closed-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .closed-wrapper {
            max-width: 550px;
            width: 100%;
            margin: auto;
        }

        /* Status Card Display */
        .white-card {
            background: var(--white);
            border: 1px solid var(--border-color);
            padding: 50px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            text-align: center;
            border-top: 3px solid var(--accent);
            animation: slideUp 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        .status-icon {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .section-header {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .status-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--primary);
        }

        .notice-text {
            margin-bottom: 35px;
            font-size: 0.95rem;
            color: var(--text-light);
            line-height: 1.8;
        }

        /* Action Buttons */
        .home-btn {
            display: block;
            width: 100%;
            text-decoration: none;
            background: var(--primary);
            color: var(--white);
            padding: 16px;
            border: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
            text-align: center;
        }

        .home-btn:hover {
            background: var(--accent);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Top Header Navigation -->
    <nav class="top-navbar">
        <a href="index.html" class="brand-logo">PRESTIGE FACE</a>
        <a href="index.html" class="exit-btn">Back Home</a>
    </nav>

    <!-- Center Stage Container Block -->
    <div class="closed-container">
        <div class="closed-wrapper">
            <main class="white-card">
                <div class="status-icon">🔒</div>
                
                <div class="section-header">
                    <h1 class="status-title">Portal is Closed</h1>
                </div>
                
                <p class="notice-text">
                    Voting for Prestige Face Nigeria has officially ended. Thank you to everyone who participated and supported their favorite contestants.
                </p>

                <a href="index.html" class="home-btn">Return to Homepage</a>
            </main>
        </div>
    </div>

</body>
</html>
