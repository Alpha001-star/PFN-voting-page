<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Closed | Prestige Face Nigeria</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --prestige-gold: #00A86B;
            --prestige-gold-dark: #028e5b;
            --deep-black: #0f0f0f;
            --pure-white: #ffffff;
            --soft-gray: #f4f4f4;
            --border-color: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--soft-gray);
            color: var(--deep-black);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Professional Header */
        .top-navbar {
            background: white;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: #028e5b;
            text-decoration: none;
        }

        .exit-btn {
            text-decoration: none;
            color: #028e5b;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            transition: all 0.3s;
        }

        .exit-btn:hover {
            background: #eee;
            color: var(--deep-black);
        }

        /* Main Container */
        .closed-wrapper {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            width: 100%;
        }

        /* Status Card */
        .white-card {
            background: white;
            border-radius: 4px;
            padding: 50px 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 4px solid var(--prestige-gold);
            animation: slideUp 0.5s ease forwards;
        }

        .status-icon {
            font-size: 3rem;
            color: #d9534f; /* Muted Red Alert */
            margin-bottom: 20px;
        }

        .section-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--soft-gray);
        }

        .status-title {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--deep-black);
        }

        .notice-text {
            margin-bottom: 30px;
            font-size: 1rem;
            color: #555;
        }

        .home-btn {
            display: inline-block;
            text-decoration: none;
            background: var(--deep-black);
            color: white;
            padding: 15px 30px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: var(--prestige-gold);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav class="top-navbar">
        <a href="#" class="brand-logo">PRESTIGE FACE</a>
        <a href="index.html" class="exit-btn">Back Home</a>
    </nav>

    <div class="closed-wrapper">
        <main class="white-card">
            <div class="status-icon">🔒</div>
            
            <div class="section-header">
                <h1 class="status-title">Portal is Closed</h1>
            </div>
            
            <p class="notice-text">
                Voting for Prestige Face Nigeria has officially ended. Thank you to everyone who participated and supported their favorite contestants. 
            </p>

            <a href="index.html" class="home-btn">Return to Homepage</a>
        </main>
    </div>

</body>
</html>
